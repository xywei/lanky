[build-system]
# license-files and the SPDX license expression are PEP 639, which hatchling
# supports from 1.27.
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "lanky"
version = "0.1.0"
description = "Python for math you can check. A Lean-hosted proof language, shaped like mypy."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Xiaoyu Wei" }]
keywords = ["lean", "mathlib", "proof", "theorem-proving", "formal-methods", "type-checking"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Pytest",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.26",
    "pymbolic>=2025.1",
]

[project.optional-dependencies]
# The Lean session driver. Core Lean 4 needs nothing else; Mathlib mode needs
# a Lake project with Mathlib fetched, which `python -m lanky.mathlib DIR` sets
# up outside the Python environment (see src/lanky/mathlib.py).
lean = [
    "lean-interact>=0.11.5",
]
# The computer-algebra oracle, which decides an identity by simplifying the
# difference of its sides to zero (see src/lanky/oracles/cas.py). sympy is
# imported on the first fact it is asked about, never with lanky.
cas = [
    "sympy>=1.12",
]

[project.urls]
Homepage = "https://github.com/xywei/lanky"
Repository = "https://github.com/xywei/lanky"
Documentation = "https://github.com/xywei/lanky/blob/main/docs/quickstart.md"
Changelog = "https://github.com/xywei/lanky/blob/main/CHANGELOG.md"
Issues = "https://github.com/xywei/lanky/issues"

[project.scripts]
lanky = "lanky.cli:main"

[project.entry-points.pytest11]
lanky = "lanky.pytest_plugin"

# The sdist is the source a downstream packager builds and tests from: the
# package, its tests, the examples and the documentation the tests compare with
# a real run. Named rather than left to the default, which takes every file
# git does not ignore, so that a stray file in a checkout never ships.
# (pyproject.toml, the README and the license file go in regardless.)
[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/examples",
    "/docs",
    "/CHANGELOG.md",
]

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# A lanky statement names its variables in the annotations, and a size such as
# "n" has no binding anywhere in the file: it is a symbolic variable that lanky
# invents while evaluating the annotation. Static checkers necessarily read that
# as an undefined name, so files that carry statements switch F821 off. Files
# that use lanky elsewhere need the same setting.
"examples/*.py" = ["F821"]
"tests/test_terms.py" = ["F821"]
"tests/test_theory.py" = ["F821"]
"tests/test_lean.py" = ["F821"]
"tests/test_adversarial.py" = ["F821"]
"tests/test_semantics.py" = ["F821"]
"tests/test_mathlib.py" = ["F821"]
"tests/test_induction.py" = ["F821"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
